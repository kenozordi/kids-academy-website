name: Deploy Laravel to Hostinger (Shared)

on:
  pull_request:
    types: [closed]   # trigger when PR is merged
    branches:
      - dev          # only deploy dev branch

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, bcmath, intl, pdo_mysql
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Generate Laravel key (only if needed)
        run: php artisan key:generate --force || true

      - name: Run Laravel optimizations
        run: |
          php artisan config:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Deploy server-side to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /kids-academy-website/
          exclude: | 
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/vendor/**
            **/public/**
          dangerous-clean-slate: false   # keep previous uploads

      - name: Deploy client-side to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/tests/**
            **/vendor/**
            **/public/theme/assets/images/**
          dangerous-clean-slate: false   # keep previous uploads
